  // Longitudes válidas y su entropía en bits
  const VALID_WORD_COUNTS = [12, 15, 18, 21, 24];
  const BITS_FOR_WORDS = { 12:128, 15:160, 18:192, 21:224, 24:256 };

  // --- Funciones auxiliares ---
  function bytesToBits(bytes) {
    let bits = '';
    for (const b of bytes) {
      bits += b.toString(2).padStart(8, '0');
    }
    return bits;
  }

  function bitsToBytes(bits) {
    const bytes = [];
    for (let i = 0; i < bits.length; i += 8) {
      bytes.push(parseInt(bits.slice(i, i+8), 2));
    }
    return new Uint8Array(bytes);
  }

  // Convierte exactamente la entropía BIP39 indicada en palabras.
  // Se mantiene separada para que la generación estándar continúe siendo idéntica.
  async function mnemonicFromEntropy(entropy) {
    const strength = entropy.length * 8;
    if (!Object.values(BITS_FOR_WORDS).includes(strength)) throw new Error('Unsupported BIP39 entropy length');
    const hashBuffer = await crypto.subtle.digest('SHA-256', entropy);
    const hashBits = bytesToBits(new Uint8Array(hashBuffer));
    const csBits = strength / 32;
    const checksum = hashBits.slice(0, csBits);
    const fullBits = bytesToBits(entropy) + checksum;
    const words = [];
    for (let i = 0; i < fullBits.length; i += 11) words.push(BIP39_WORDS[parseInt(fullBits.slice(i, i + 11), 2)]);
    return words.join(' ');
  }

  // Mezcla la entropía del sensor con CSPRNG del sistema y extrae una secuencia
  // determinista mediante SHA-256. El sensor nunca sustituye a crypto.getRandomValues().
  async function generateMotionEntropy(wordCount, sensorBytes) {
    if (!VALID_WORD_COUNTS.includes(wordCount)) wordCount = 12;
    const strength = BITS_FOR_WORDS[wordCount];
    const randomSeed = crypto.getRandomValues(new Uint8Array(32));
    const sensorDigest = new Uint8Array(await crypto.subtle.digest('SHA-256', sensorBytes));
    const pool = new Uint8Array(randomSeed.length + sensorDigest.length);
    pool.set(randomSeed, 0);
    pool.set(sensorDigest, randomSeed.length);

    // Expandimos con SHA-256 por contador y recortamos exactamente a ENT bits.
    const out = new Uint8Array(strength / 8);
    let offset = 0, counter = 0;
    while (offset < out.length) {
      const blockInput = new Uint8Array(pool.length + 4);
      blockInput.set(pool, 0);
      new DataView(blockInput.buffer).setUint32(pool.length, counter++, false);
      const block = new Uint8Array(await crypto.subtle.digest('SHA-256', blockInput));
      const take = Math.min(block.length, out.length - offset);
      out.set(block.slice(0, take), offset);
      offset += take;
    }
    return mnemonicFromEntropy(out);
  }

  // Recolecta ruido de movimiento del dispositivo. Intenta Generic Sensor Gyroscope
  // y usa DeviceMotionEvent como fallback cuando el navegador no expone Gyroscope.
  // Collects only real motion/orientation readings exposed by the device.
  // No random or synthetic sensor values are ever generated here.
  async function collectMotionEntropy({durationMs=5000, onProgress=()=>{}, onSample=()=>{}}={}) {
    if (typeof window === 'undefined') throw new Error('Motion sensors unavailable');
    if (!window.isSecureContext) throw new Error('Motion sensors require HTTPS or localhost in this browser. Open DibaVault from its secure URL and allow motion/sensor access when prompted.');

    const chunks=[];
    const started=performance.now();
    let samples=0;
    const latest={
      gx:null,gy:null,gz:null,
      alpha:null,beta:null,gamma:null,
      ax:null,ay:null,az:null,
      orientationSource:'',motionSource:'',gyroSource:'',accelSource:'',
      source:'',timeMs:0
    };

    const requestPermission=async(Ctor,label)=>{
      if(!Ctor||typeof Ctor.requestPermission!=='function')return 'granted';
      try{
        const permission=await Ctor.requestPermission();
        if(permission==='granted')return 'granted';
        throw new Error(`${label} permission was denied by the browser.`);
      }catch(err){
        throw new Error(err?.message||`${label} permission was denied by the browser.`);
      }
    };

    // On browsers that expose requestPermission(), this must run from the
    // user's button click. Chrome Android normally exposes the sensor events
    // directly in a secure context and does not require this API.
    let grantedSensors=0;
    const permissionErrors=[];
    try{await requestPermission(window.DeviceMotionEvent,'Motion sensor');grantedSensors++;}catch(e){permissionErrors.push(e);}
    try{await requestPermission(window.DeviceOrientationEvent,'Orientation sensor');grantedSensors++;}catch(e){permissionErrors.push(e);}
    if(grantedSensors===0){throw permissionErrors[0]||new Error('Permission to access motion sensors was denied by the browser.');}

    const clampI32=v=>Math.max(-2147483648,Math.min(2147483647,Math.round(Number(v))));
    const writeI32=(view,offset,value)=>view.setInt32(offset,clampI32(value),true);
    const writeU32=(view,offset,value)=>view.setUint32(offset,Math.max(0,Math.min(0xffffffff,Math.floor(Number(value)))),true);

    const commit=({gx,gy,gz,alpha,beta,gamma,ax,ay,az,source,gyroSource,accelSource,orientationSource,motionSource,eventTime})=>{
      const incoming={gx,gy,gz,alpha,beta,gamma,ax,ay,az};
      for(const [key,value] of Object.entries(incoming)){
        if(Number.isFinite(value)) latest[key]=Number(value);
      }
      if(gyroSource)latest.gyroSource=gyroSource;
      if(accelSource)latest.accelSource=accelSource;
      if(orientationSource)latest.orientationSource=orientationSource;
      if(motionSource)latest.motionSource=motionSource;
      latest.source=source||latest.source||'';
      latest.timeMs=Math.max(0,performance.now()-started);

      // Encode only channels that actually arrived in this event.
      const values=[gx,gy,gz,alpha,beta,gamma,ax,ay,az];
      const mask=values.reduce((m,v,i)=>m|(Number.isFinite(v)?(1<<i):0),0);
      if(mask===0)return;

      // 9 signed sensor channels + timestamp + presence mask + source id.
      const buf=new ArrayBuffer(9*4+4+1+1);
      const view=new DataView(buf);
      values.forEach((v,i)=>writeI32(view,i*4,Number.isFinite(v)?Number(v)*1000000:0));
      writeU32(view,36,latest.timeMs*1000);
      view.setUint8(40,mask);
      view.setUint8(41,source==='gyro'?1:source==='accelerometer'?2:source==='deviceorientation'?3:source==='devicemotion'?4:5);
      chunks.push(new Uint8Array(buf));
      samples++;
      onSample({...latest,samples});
    };

    let gyroSensor=null,accelerometerSensor=null;
    const cleanupSensors=[];
    const motionHandler=e=>{
      const r=e?.rotationRate||{};
      const a=e?.acceleration||{};
      const g=e?.accelerationIncludingGravity||{};
      const hasRotation=[r.alpha,r.beta,r.gamma].every(Number.isFinite);
      // Prefer linear acceleration when supplied; otherwise use the real
      // accelerationIncludingGravity reading. Never fabricate missing axes.
      const accel=([a.x,a.y,a.z].every(Number.isFinite)?a:g);
      const hasAccel=[accel.x,accel.y,accel.z].every(Number.isFinite);
      if(!hasRotation&&!hasAccel)return;
      commit({
        alpha:hasRotation?Number(r.alpha):null,
        beta:hasRotation?Number(r.beta):null,
        gamma:hasRotation?Number(r.gamma):null,
        ax:hasAccel?Number(accel.x):null,
        ay:hasAccel?Number(accel.y):null,
        az:hasAccel?Number(accel.z):null,
        source:'devicemotion',
        motionSource:'DeviceMotionEvent'
      });
    };
    const orientationHandler=e=>{
      if(![e?.alpha,e?.beta,e?.gamma].every(Number.isFinite))return;
      commit({alpha:Number(e.alpha),beta:Number(e.beta),gamma:Number(e.gamma),source:'deviceorientation',orientationSource:'DeviceOrientationEvent'});
    };
    window.addEventListener('devicemotion',motionHandler,{passive:true});
    window.addEventListener('deviceorientation',orientationHandler,{passive:true});
    cleanupSensors.push(()=>window.removeEventListener('devicemotion',motionHandler));
    cleanupSensors.push(()=>window.removeEventListener('deviceorientation',orientationHandler));

    // Generic Sensor API: real hardware gyroscope.
    if(typeof window.Gyroscope==='function'){
      try{
        gyroSensor=new Gyroscope({frequency:100});
        gyroSensor.addEventListener('reading',()=>{
          if([gyroSensor.x,gyroSensor.y,gyroSensor.z].every(Number.isFinite)){
            commit({gx:Number(gyroSensor.x),gy:Number(gyroSensor.y),gz:Number(gyroSensor.z),source:'gyro',gyroSource:'Gyroscope'});
          }
        });
        gyroSensor.addEventListener('error',()=>{});
        gyroSensor.start();
        cleanupSensors.push(()=>{try{gyroSensor?.stop();}catch{}});
      }catch{}
    }

    // Generic Sensor API: real 3-axis accelerometer. This is independent of
    // DeviceMotion and gives direct acceleration readings when supported.
    if(typeof window.Accelerometer==='function'){
      try{
        accelerometerSensor=new Accelerometer({frequency:100});
        accelerometerSensor.addEventListener('reading',()=>{
          if([accelerometerSensor.x,accelerometerSensor.y,accelerometerSensor.z].every(Number.isFinite)){
            commit({ax:Number(accelerometerSensor.x),ay:Number(accelerometerSensor.y),az:Number(accelerometerSensor.z),source:'accelerometer',accelSource:'Accelerometer'});
          }
        });
        accelerometerSensor.addEventListener('error',()=>{});
        accelerometerSensor.start();
        cleanupSensors.push(()=>{try{accelerometerSensor?.stop();}catch{}});
      }catch{}
    }

    const deadline=started+durationMs;
    try{
      while(performance.now()<deadline){
        onProgress(Math.min(1,(performance.now()-started)/durationMs));
        await new Promise(resolve=>setTimeout(resolve,25));
      }
    }finally{
      cleanupSensors.forEach(fn=>{try{fn();}catch{}});
      onProgress(1);
    }

    // A valid motion seed requires actual sensor samples, not a generated fallback.
    if(samples<8||chunks.length<8){
      throw new Error('No se obtuvieron suficientes lecturas reales del dispositivo. Mueve el teléfono e inténtalo nuevamente.');
    }
    return concatMotionChunks(chunks);
  }

  function concatMotionChunks(chunks) {
    const total = chunks.reduce((n, x) => n + x.length, 0);
    const out = new Uint8Array(total);
    let offset = 0;
    for (const chunk of chunks) { out.set(chunk, offset); offset += chunk.length; }
    return out;
  }

  // ---------------------------------------------------------------------------
  // Secure optional BIP39 passphrase generator
  // Uses the EFF Large Diceware list (7,776 entries, ~12.925 bits/word).
  // The list is fetched only when the user explicitly requests generation and
  // is verified byte-for-byte by SHA-256 before use. The generated passphrase
  // never enters localStorage in plaintext.
  const DICEWARE_LIST_URLS = [
    'https://www.eff.org/files/2016/07/18/eff_large_wordlist.txt',
    'https://raw.githubusercontent.com/erans/dicepass/master/eff_large_wordlist.txt'
  ];
  const DICEWARE_EXPECTED_SHA256 = 'addd35536511597a02fa0a9ff1e5284677b8883b83e986e43f15a3db996b903e';
  const DICEWARE_WORD_COUNT = 7776;
  const DICEWARE_BITS_PER_WORD = Math.log2(DICEWARE_WORD_COUNT);
  const passphraseUtf8 = s => new TextEncoder().encode(String(s).normalize('NFKD'));
  let dicewareWordsCache = null;
  let dicewareLoadPromise = null;

  function bytesConcat(...arrays){
    const total=arrays.reduce((n,a)=>n+a.length,0);
    const out=new Uint8Array(total);let off=0;
    for(const a of arrays){out.set(a,off);off+=a.length;}
    return out;
  }

  async function hmacSha256(keyBytes,dataBytes){
    const key=await crypto.subtle.importKey('raw',keyBytes,{name:'HMAC',hash:'SHA-256'},false,['sign']);
    return new Uint8Array(await crypto.subtle.sign('HMAC',key,dataBytes));
  }

  // RFC 5869-style HKDF-SHA-256 implemented with Web Crypto HMAC for broad
  // browser compatibility. This only expands/pseudorandomly separates input;
  // it never increases the underlying entropy beyond the source pool.
  async function hkdfSha256(ikm,salt,info,length){
    const saltBytes=(salt&&salt.length)?salt:new Uint8Array(32);
    const prk=await hmacSha256(saltBytes,ikm);
    const infoBytes=info instanceof Uint8Array?info:new TextEncoder().encode(String(info||''));
    const out=new Uint8Array(length);let t=new Uint8Array(0),offset=0,counter=1;
    while(offset<length){
      t=await hmacSha256(prk,bytesConcat(t,infoBytes,new Uint8Array([counter++])));
      const take=Math.min(t.length,length-offset);out.set(t.slice(0,take),offset);offset+=take;
      if(counter>255)throw new Error('HKDF output is too long');
    }
    return out;
  }

  async function sha256HexBytes(bytes){
    return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function loadDicewareWordlist(){
    if(dicewareWordsCache)return dicewareWordsCache;
    if(dicewareLoadPromise)return dicewareLoadPromise;
    dicewareLoadPromise=(async()=>{
      let lastError=null;
      for(const url of DICEWARE_LIST_URLS){
        try{
          const res=await fetch(url,{cache:'no-store',mode:'cors'});
          if(!res.ok)throw new Error('HTTP '+res.status);
          const text=await res.text();
          const rawBytes=new TextEncoder().encode(text);
          const digest=await sha256HexBytes(rawBytes);
          if(digest!==DICEWARE_EXPECTED_SHA256)throw new Error('Diceware list SHA-256 mismatch');
          const words=text.split(/\r?\n/).filter(Boolean).map(line=>{
            const parts=line.trim().split(/\s+/);
            return parts.length>=2?parts.slice(1).join(' '):parts[0];
          }).filter(Boolean);
          if(words.length!==DICEWARE_WORD_COUNT || new Set(words).size!==DICEWARE_WORD_COUNT)throw new Error('Diceware list must contain exactly 7,776 unique words');
          dicewareWordsCache=words;
          return words;
        }catch(e){lastError=e;}
      }
      throw new Error('Unable to load the verified EFF Diceware wordlist. Check the network connection and try again. '+(lastError?.message||''));
    })();
    try{return await dicewareLoadPromise;}finally{dicewareLoadPromise=null;}
  }

  function readBitsAsNumber(bytes,bitOffset,count){
    let value=0;
    for(let i=0;i<count;i++){
      const p=bitOffset+i;
      value=(value<<1)|((bytes[p>>>3]>>>(7-(p&7)))&1);
    }
    return value;
  }

  // Maps a pseudorandom bitstream to 7,776 equally-likely word indices using
  // rejection sampling (13-bit candidate, accept 0..7775). This avoids the
  // modulo bias that would be introduced by `random % 7776`.
  async function dicewareFromEntropy(entropyBytes,targetBits){
    const words=await loadDicewareWordlist();
    const bitLimit=Math.max(1,Math.min(512,Math.floor(Number(targetBits)||256)));
    const wordCount=Math.min(40,Math.max(1,Math.ceil(bitLimit/DICEWARE_BITS_PER_WORD)));
    const stream=await hkdfSha256(entropyBytes,passphraseUtf8('DibaVault/Diceware/v1/salt'),passphraseUtf8(`DibaVault/Diceware/v1/${bitLimit}`),256);
    const output=[];
    let bitPos=0;
    while(output.length<wordCount){
      if(bitPos+13>stream.length*8){
        const more=await hkdfSha256(entropyBytes,passphraseUtf8('DibaVault/Diceware/v1/salt'),passphraseUtf8(`DibaVault/Diceware/v1/${bitLimit}/continuation/${output.length}`),64);
        stream.set(more.slice(0,Math.min(more.length,stream.length)),0);
        bitPos=0;
      }
      const candidate=readBitsAsNumber(stream,bitPos,13);bitPos+=13;
      if(candidate>=DICEWARE_WORD_COUNT)continue;
      output.push(words[candidate]);
    }
    return {passphrase:output.join(' '),wordCount,entropyBits:bitLimit,capacityBits:wordCount*DICEWARE_BITS_PER_WORD};
  }

  async function generateSecurePassphrase({bits=256,sensorBytes=null}={}){
    const targetBits=Math.max(128,Math.min(512,Number(bits)||256));
    // The selected strength is an actual entropy cap: for 256 bits, the
    // cryptographic source supplied to the Diceware derivation contains 256
    // bits; for 512 bits it contains the full 512-bit pool.
    const targetBytes=targetBits/8;
    const systemEntropy=crypto.getRandomValues(new Uint8Array(targetBytes));
    let source='system';
    let masterEntropy=systemEntropy;
    if(sensorBytes&&sensorBytes.length){
      const sensorDigest=new Uint8Array(await crypto.subtle.digest('SHA-256',sensorBytes));
      masterEntropy=await hkdfSha256(
        bytesConcat(systemEntropy,sensorDigest),
        passphraseUtf8('DibaVault/passphrase/master/v1/salt'),
        passphraseUtf8('DibaVault/passphrase/master/v1'),
        targetBytes
      );
      source='system+motion';
    }
    const result=await dicewareFromEntropy(masterEntropy,targetBits);
    return {...result,source};
  }

  // --- Función principal: generar mnemónico BIP39 ---
  async function generateBIP39Mnemonic(wordCount) {
    if (!VALID_WORD_COUNTS.includes(wordCount)) wordCount = 12;
    const strength = BITS_FOR_WORDS[wordCount];
    const entropyBytes = strength / 8;

    // 1. Generar entropía aleatoria con Web Crypto API
    const entropy = crypto.getRandomValues(new Uint8Array(entropyBytes));

    // 2. Calcular checksum (primeros ENT/32 bits del SHA256)
    const hashBuffer = await crypto.subtle.digest('SHA-256', entropy);
    const hash = new Uint8Array(hashBuffer);
    const hashBits = bytesToBits(hash);
    const csBits = strength / 32;
    const checksum = hashBits.slice(0, csBits);

    // 3. Concatenar entropía + checksum
    const entBits = bytesToBits(entropy);
    const fullBits = entBits + checksum;

    // 4. Dividir en grupos de 11 bits y mapear a palabras
    const words = [];
    for (let i = 0; i < fullBits.length; i += 11) {
      const chunk = fullBits.slice(i, i + 11);
      const index = parseInt(chunk, 2);
      words.push(BIP39_WORDS[index]);
    }

    return words.join(' ');
  }

  // --- Exponer la función globalmente ---
  window._bip39 = {
    generateMnemonic: generateBIP39Mnemonic,
    wordlist: BIP39_WORDS,
    validWordCounts: VALID_WORD_COUNTS,
    collectMotionEntropy,
    generateMotionEntropy,
    generateSecurePassphrase,
    loadDicewareWordlist,
    dicewareBitsPerWord: DICEWARE_BITS_PER_WORD
  };

  console.log('✅ BIP39 interno cargado correctamente.');
})();

// Verify the embedded BIP39 list before use. The shipped HTML contains a
// self-contained list, but if its integrity is not exactly 2048 unique words,
// the canonical BIP39 English list is fetched and verified at startup.
window._bip39.ready=(async()=>{
  const EXPECTED_BIP39_ENGLISH_SHA256='2f5eed53a4727b4bf8880d8f3f199efc90e58503646d9ff8eff3a2ed3b24dbda';
  const wl=window._bip39.wordlist;
  const canonicalBytes=words=>new TextEncoder().encode(words.join('\n')+'\n');
  const hashHex=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
  const localShape=Array.isArray(wl)&&wl.length===2048&&new Set(wl).size===2048&&wl[0]==='abandon'&&wl[2047]==='zoo';
  if(localShape&&await hashHex(canonicalBytes(wl))===EXPECTED_BIP39_ENGLISH_SHA256)return true;
  try{
    const res=await fetch('https://raw.githubusercontent.com/bitcoin/bips/master/bip-0039/english.txt',{cache:'no-store'});
    if(!res.ok)throw Error('HTTP '+res.status);
    const words=(await res.text()).split(/\r?\n/).filter((x,i,a)=>i<a.length-1||x!=='').map(x=>x.trim()).filter(Boolean);
    const ok=words.length===2048&&new Set(words).size===2048&&words[0]==='abandon'&&words[2047]==='zoo'&&await hashHex(canonicalBytes(words))===EXPECTED_BIP39_ENGLISH_SHA256;
    if(!ok)throw Error('Canonical BIP39 wordlist integrity check failed');
    wl.splice(0,wl.length,...words);
    return true;
  }catch(e){
    throw Error('BIP39 English wordlist integrity check failed. Embedded list does not match the official Bitcoin BIP39 list.');
  }
})();

  function drawBalanceChart(canvas,index,asset,rangeKey=balanceChartRange){
    if(!canvas||!asset)return;
    const ctx=canvas.getContext('2d');
    if(!ctx)return;
    const dpr=Math.max(1,window.devicePixelRatio||1);
    const rect=canvas.getBoundingClientRect();
    const w=Math.max(220,Math.round(rect.width||canvas.clientWidth||320));
    const h=Math.max(140,Math.round(rect.height||canvas.clientHeight||180));
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
    const pts=chartRangePoints(index,asset,rangeKey);
    if(!pts.length)return;
    const color=balanceChartColor(asset);
    const pad={l:w<300?38:44,r:9,t:12,b:25};
    const pw=Math.max(1,w-pad.l-pad.r),ph=Math.max(1,h-pad.t-pad.b);
    const values=pts.map(p=>p.v);
    let min=Math.min(...values,0),max=Math.max(...values,1);
    if(!Number.isFinite(min))min=0;if(!Number.isFinite(max))max=1;
    if(Math.abs(max-min)<1e-12){const p=Math.max(Math.abs(max)*.08,.000001);min=Math.max(0,min-p);max=max+p;}
    else{const span=max-min;min=Math.max(0,min-span*.10);max=max+span*.10;}
    // Vertical scale slider: 100% is the default fitted scale. Higher values zoom in,
    // lower values widen the visible data range. It is intentionally transient and
    // lives on the currently open chart only; closing the chart resets it to 100%.
    const scalePct=Math.max(50,Math.min(200,Number(canvas.dataset.chartScale)||100));
    if(Math.abs(max-min)>1e-12 && scalePct!==100){
      const baseSpan=max-min,center=(min+max)/2,scaledSpan=baseSpan*(100/scalePct);
      let scaledMin=center-scaledSpan/2,scaledMax=center+scaledSpan/2;
      if(scaledMin<0){scaledMin=0;scaledMax=scaledSpan;}
      if(scaledMax<=scaledMin){scaledMin=0;scaledMax=1;}
      min=scaledMin;max=scaledMax;
    }
    const xFor=i=>pts.length===1?pad.l+pw/2:pad.l+pw*i/(pts.length-1);
    const yFor=v=>pad.t+ph-(v-min)/(max-min)*ph;
    const screenPts=pts.map((p,i)=>({x:xFor(i),y:yFor(p.v)}));

    ctx.font='10px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif';
    ctx.lineWidth=1;ctx.strokeStyle='rgba(138,160,156,.14)';ctx.fillStyle='#5f7370';ctx.textAlign='right';ctx.textBaseline='middle';
    for(let i=0;i<4;i++){const y=pad.t+ph*i/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(formatChartValue(max-(max-min)*i/3),pad.l-6,y);}
    ctx.strokeStyle='rgba(138,160,156,.07)';
    for(let i=0;i<5;i++){const x=pad.l+pw*i/4;ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();}

    // TradingView-like smooth line: cubic Bézier interpolation instead of sharp point-to-point segments.
    const smoothPath=(context,points)=>{
      if(points.length===1){context.moveTo(points[0].x,points[0].y);return;}
      context.moveTo(points[0].x,points[0].y);
      for(let i=0;i<points.length-1;i++){
        const p0=points[i-1]||points[i],p1=points[i],p2=points[i+1],p3=points[i+2]||p2;
        const cp1x=p1.x+(p2.x-p0.x)/6,cp1y=p1.y+(p2.y-p0.y)/6;
        const cp2x=p2.x-(p3.x-p1.x)/6,cp2y=p2.y-(p3.y-p1.y)/6;
        context.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,p2.x,p2.y);
      }
    };

    // Area chart: the fill follows the same asset-specific color as the price/balance line.
    // The vertical alpha fade keeps the area readable without overpowering the chart grid.
    const hexToRgba=(hex,alpha)=>{
      const m=String(hex||'').trim().match(/^#([0-9a-f]{6})$/i);
      if(!m)return `rgba(19,214,195,${alpha})`;
      const n=parseInt(m[1],16);
      return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
    };
    ctx.save();
    const gradient=ctx.createLinearGradient(0,pad.t,0,pad.t+ph);
    gradient.addColorStop(0,hexToRgba(color,.30));
    gradient.addColorStop(.55,hexToRgba(color,.14));
    gradient.addColorStop(1,hexToRgba(color,.025));
    ctx.beginPath();smoothPath(ctx,screenPts);ctx.lineTo(screenPts[screenPts.length-1].x,pad.t+ph);ctx.lineTo(screenPts[0].x,pad.t+ph);ctx.closePath();ctx.fillStyle=gradient;ctx.fill();ctx.restore();

    ctx.beginPath();smoothPath(ctx,screenPts);ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=2.5;ctx.strokeStyle=color;ctx.shadowColor=color;ctx.shadowBlur=7;ctx.stroke();ctx.shadowBlur=0;
    const last=screenPts[screenPts.length-1];ctx.beginPath();ctx.arc(last.x,last.y,3.2,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    ctx.beginPath();ctx.arc(last.x,last.y,6,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;ctx.stroke();

    ctx.font='9px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif';ctx.fillStyle='#5f7370';ctx.textBaseline='alphabetic';
    ctx.textAlign='left';ctx.fillText(chartTimeLabel(pts[0].t,rangeKey),pad.l,h-7);
    ctx.textAlign='center';ctx.fillText(chartTimeLabel(pts[Math.floor((pts.length-1)/2)].t,rangeKey),w/2,h-7);
    ctx.textAlign='right';ctx.fillText(chartTimeLabel(pts[pts.length-1].t,rangeKey),w-pad.r,h-7);
  }

  async function ensureQRCodeGenerator(){
    if(typeof window.qrcode==='function')return true;
    return await new Promise(resolve=>{
      const existing=document.querySelector('script[data-dibavault-qr]');
      if(existing){existing.addEventListener('load',()=>resolve(typeof window.qrcode==='function'),{once:true});existing.addEventListener('error',()=>resolve(false),{once:true});return;}
      const script=document.createElement('script');
      script.src='https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.min.js';
      script.async=true;script.dataset.dibavaultQr='1';
      script.onload=()=>resolve(typeof window.qrcode==='function');
      script.onerror=()=>resolve(false);
      document.head.appendChild(script);
    });
  }

  async function openAddressQR(network,address){
    const host=$('#modalHost');
    const cleanAddress=String(address||'').trim();
    host.classList.add('show');
    host.innerHTML=`<div class="sheet qr-sheet"><div class="handle"></div><div class="confirm-icon">▦</div><h2 class="center">QR Code</h2><p class="center muted">This QR is generated dynamically from the exact derived address shown below.</p><div id="qrDynamicBox" class="qr-box"><div class="spin"></div></div><div class="addr qr-address">${esc(cleanAddress)}</div><div id="qrDynamicStatus" class="small center mt">Generating QR…</div><div class="row mt"><button id="closeQR" class="btn btn-primary btn-block">Close</button></div></div>`;
    $('#closeQR').onclick=()=>closeModal();
    if(!cleanAddress){
      $('#qrDynamicBox').innerHTML='<div class="small center">Address unavailable.</div>';
      $('#qrDynamicStatus').textContent='Unable to generate QR without an address.';
      return;
    }
    try{
      const ready=await ensureQRCodeGenerator();
      if(!ready)throw new Error('QR generator could not be loaded');
      const qr=window.qrcode(0,'M');
      qr.addData(cleanAddress,'Byte');
      qr.make();
      $('#qrDynamicBox').innerHTML=qr.createSvgTag({cellSize:4,margin:16,scalable:true,alt:{text:`QR code for ${network?.name||'wallet'} address ${cleanAddress}`},title:{text:`${network?.name||'Wallet'} address QR`}});
      const svg=$('#qrDynamicBox svg');
      if(svg){svg.style.width='100%';svg.style.height='100%';svg.style.maxWidth='100%';svg.style.display='block';}
      $('#qrDynamicStatus').textContent='QR payload: exact address above. No amount or private key is included.';
    }catch(e){
      $('#qrDynamicBox').innerHTML='<div class="alert danger center">Unable to generate the dynamic QR.</div>';
      $('#qrDynamicStatus').textContent=e.message||'QR generation failed.';
    }

        }

    function updateStrength(){

      else {level='Low';color='var(--danger)';}
      el.innerHTML=`Security: <span style="color:${color};font-weight:bold;">${level}</span> (${len} digits)`;
    }
    const passphraseLevelForBits=bits=>passphraseLevels.find(x=>x.bits===Number(bits))||passphraseLevels[4];
    const refreshPassphraseStrength=()=>{
      const level=passphraseLevelForBits(passphraseBits),el=$('#passphraseStrengthInfo');
      passphraseWords=level.words;
      if(el)el.textContent=`Target: ${level.bits} bits · generated length: ${level.words} words · wordlist capacity: ${(level.words*window._bip39.dicewareBitsPerWord).toFixed(1)} bits`;

    const syncPassphraseUI=()=>{

      if(mode==='none'){currentPassphrase='';currentPassphraseMeta={mode:'none',bits:0,words:0,source:''};}

        currentPassphraseMeta={mode:'manual',bits:0,words:0,source:'manual'};
      }
      else{
        passphraseBits=Number($('#passphraseStrengthSelect')?.value||passphraseBits);
        const level=passphraseLevelForBits(passphraseBits);passphraseWords=level.words;
        currentPassphraseMeta={mode:'generated',bits:passphraseBits,words:passphraseWords,source:passphraseSource};
      }

    $('#setupPin').addEventListener('input',updateStrength); updateStrength();
    $('#backSetupChoice').onclick=()=>{

    const setEntropyStatus=(text,type='info')=>{const el=$('#entropyStatus');if(el){el.className='alert '+type+' mt';el.textContent=text;}};

    $('#passphraseStrengthSelect').onchange=()=>{passphraseBits=Number($('#passphraseStrengthSelect').value);const level=passphraseLevelForBits(passphraseBits);passphraseWords=level.words;currentPassphrase='';$('#generatedPassphrase').value='';$('#passphraseStatus').textContent='Strength changed — generate a new passphrase.';refreshPassphraseStrength();};
    $('#passphraseEntropySource').onchange=()=>{passphraseSource=$('#passphraseEntropySource').value;currentPassphrase='';$('#generatedPassphrase').value='';$('#passphraseStatus').textContent='Entropy source changed — generate a new passphrase.';};
    $('#toggleGeneratedPassphrase').onclick=()=>{const el=$('#generatedPassphrase'),btn=$('#toggleGeneratedPassphrase');if(!el||!btn)return;const show=el.type==='password';el.type=show?'text':'password';btn.textContent=show?'Hide passphrase':'Show passphrase';};
    const generateSeedFromSystem=async()=>{
      const btn=$('#generateStandardSeed'),motionBtn=$('#generateMotionSeed');
      if(!btn||!motionBtn)return;

      try{
        if(window._bip39?.ready) await window._bip39.ready;

        if(!VALID_WORD_COUNTS.includes(selected))throw new Error('Unsupported BIP39 word count');

      const motionX=$('#motionX'),motionY=$('#motionY'),motionZ=$('#motionZ'),motionAlpha=$('#motionAlpha'),motionBeta=$('#motionBeta'),motionGamma=$('#motionGamma'),motionAX=$('#motionAX'),motionAY=$('#motionAY'),motionAZ=$('#motionAZ'),motionSource=$('#motionTelemetrySource'),motionSamples=$('#motionSampleCount'),motionElapsed=$('#motionElapsed');
      if(!btn||!motionBtn)return;
      btn.disabled=true; motionBtn.disabled=true;

      if(motionGamma)motionGamma.textContent='—';

        status.textContent=`Configured · ${result.entropyBits} bits · ${result.wordCount} words · ${result.source==='system+motion'?'system + phone motion':'system CSPRNG'}`;
      }catch(e){

      else if(mode==='generated'){pass=String(currentPassphrase||'').normalize('NFKD');meta={...currentPassphraseMeta,mode:'generated'};if(!pass)return toast('Generate the secure passphrase before continuing, or choose None/manual mode.','err');}
      window._hdwallet.validateMnemonic(seed,window._bip39.wordlist).then(ok=>{if(!ok)return toast('Mnemonic checksum is invalid','err');renderFinish(p,seed,wordCount,pass,meta);const sd=$('#seedDisplay');if(sd){sd.value='';sd.textContent='';}}).catch(e=>toast('Mnemonic validation failed: '+e.message,'err'));
    };
  }

  function renderFinish(pin, seed, length, passphrase='', passphraseMeta={mode:passphrase?'manual':'none',bits:0,words:0,source:passphrase?'manual':''}){
    app.innerHTML=`<div class="view slide-in"><div class="card accent"><h1>Finish & Confirm</h1><p class="muted">Review the configuration of your local wallet before creating it.</p><div class="steps"><div class="step done">1 · Demo wallet</div><div class="step active">2 · Finish</div></div>
      <div class="card" style="background:var(--bg2);">

        <div class="kv"><span class="k">Recovery phrase</span><span class="v" style="max-width:60%;font-size:.8rem;">${esc(seed.split(' ').slice(0,4).join(' '))}…</span></div>

  // Splash-screen parallax: the aurora layer moves opposite to the device tilt.

  (function initStartupParallax(){
    const aura=$('#startupAura');
    const splash=$('#startupScreen');
    if(!aura||!splash)return;
    let baseGamma=null,baseBeta=null,hasSensor=false,lastX=0,lastY=0,raf=0,orientationBound=false;
    const maxX=112,maxY=88,smoothing=.12;
    const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
    const apply=(targetX,targetY,immediate=false)=>{
      const nx=clamp(targetX,-maxX,maxX),ny=clamp(targetY,-maxY,maxY);
      if(immediate){lastX=nx;lastY=ny;}else{lastX+=(nx-lastX)*smoothing;lastY+=(ny-lastY)*smoothing;}
      aura.style.setProperty('--startup-parallax-x',`${lastX.toFixed(2)}px`);
      aura.style.setProperty('--startup-parallax-y',`${lastY.toFixed(2)}px`);
      if(Math.abs(nx-lastX)>0.2||Math.abs(ny-lastY)>0.2){
        cancelAnimationFrame(raf);
        raf=requestAnimationFrame(()=>{raf=0;apply(targetX,targetY,false)});
      }
    };
    const onOrientation=e=>{
      const gamma=Number(e?.gamma),beta=Number(e?.beta);
      if(!Number.isFinite(gamma)||!Number.isFinite(beta))return;
      if(baseGamma===null){baseGamma=gamma;baseBeta=beta;hasSensor=true;aura.classList.add('parallax-ready');return;}
      apply(-(gamma-baseGamma)*3.2,-(beta-baseBeta)*2.6);
    };
    const armOrientation=()=>{
      if(orientationBound)return true;
      window.addEventListener('deviceorientation',onOrientation,{passive:true});
      orientationBound=true;
      return true;
    };
    const requestOrientationPermission=async()=>{
      if(window.isSecureContext!==true){
        armOrientation();
        return false;
      }
      try{
        if(typeof window.DeviceOrientationEvent==='function'&&typeof window.DeviceOrientationEvent.requestPermission==='function'){
          const permission=await window.DeviceOrientationEvent.requestPermission();
          if(permission!=='granted')return false;
        }

    };
    const onTouchStart=e=>{const t=e.touches?.[0];if(!t)return;splash.dataset.touchX=String(t.clientX);splash.dataset.touchY=String(t.clientY);};
    const onTouchMove=e=>{

    splash.addEventListener('touchmove',onTouchMove,{passive:true});
    splash.addEventListener('touchend',onTouchEnd,{passive:true});
    splash.addEventListener('touchcancel',onTouchEnd,{passive:true});
    window.addEventListener('resize',()=>{baseGamma=null;baseBeta=null;},{passive:true});
    if(startupBtn)startupBtn.onclick=async()=>{
      if(startupBtn.dataset.starting==='1')return;

      await new Promise(r=>setTimeout(r,startupArrowMotionDurationMs));

    };
  })();

  async function validateRecipientAddress(address,n){

      if(f==='solana')return {valid:/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(s),reason:'Address not accepted'};

        if(symbol==='DASH')return {valid:/^[X7][1-9A-HJ-NP-Za-km-z]{25,34}$/.test(s),reason:'Address not accepted'};
        if(symbol==='ZEC')return {valid:/^(t1|t3)[1-9A-HJ-NP-Za-km-z]{33}$/.test(s),reason:'Address not accepted'};
        return {valid:/^[13][1-9A-HJ-NP-Za-km-z]{25,34}$/.test(s)||/^bc1[ac-hj-np-z02-9]{11,71}$/i.test(s),reason:'Address not accepted'};
      }
      if(f==='xrp')return {valid:/^r[1-9A-HJ-NP-Za-km-z]{24,34}$/.test(s),reason:'Address not accepted'};
      if(f==='stellar')return {valid:/^G[A-Z2-7]{55}$/.test(s),reason:'Address not accepted'};
      if(f==='multiversx')return {valid:/^erd1[0-9ac-hj-np-z]{58}$/i.test(s),reason:'Address not accepted'};

  function isP2trScript(script){return !!script && script.length===34 && script[0]===0x51 && script[1]===0x20;}
  function xOnly(pub){return Buffer.from(pub).subarray(1,33);}

  async function openInitialRecovery(reason='initial'){

    host.innerHTML=`<div class="sheet"><div class="handle"></div><div class="confirm-icon">📝</div><h2 class="center">${reason==='blocked'?'Recover blocked wallet':'Recover wallet'}</h2><p class="center muted">Enter the BIP39 recovery phrase used when this wallet was created.</p><label>Recovery phrase</label><textarea id="initialRecoveryInput" placeholder="Enter your BIP39 recovery phrase" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea><label>BIP39 passphrase <span class="small">(optional)</span></label><input id="initialRecoveryPass" type="password" placeholder="Leave blank if none" autocomplete="off" spellcheck="false"><div class="card mt" style="margin-left:0;margin-right:0;background:#0b1315"><h3>Optional wallet state</h3><p class="small muted">Import a previously exported, signed wallet-state file to restore accounts, demo balances, assets and settings without putting the seed in that file.</p><input id="walletStateFile" type="file" accept="application/json,.json" style="display:none"><button id="chooseWalletState" class="btn btn-ghost btn-block">Import signed wallet state</button><div id="walletStateName" class="small mt">No state file selected.</div></div><div id="initialRecoveryStatus" class="alert info mt">${env?'If an encrypted wallet is active, the phrase/passphrase must match that exact vault. Wallet-state import is optional and not used while an existing vault is authoritative.':'No encrypted vault is available. A valid phrase will rebuild the wallet keys and standard HD accounts; an optional signed wallet-state file can restore the previous simulator state.'}</div><div class="confirm-actions"><button id="cancelInitialRecovery" class="btn cancel">Cancel</button><button id="verifyInitialRecovery" class="btn accept">Verify</button></div></div>`;

    const stateFile=$('#walletStateFile'),stateName=$('#walletStateName'),choose=$('#chooseWalletState');

      const file=stateFile.files?.[0];

    };
    $('#cancelInitialRecovery').onclick=()=>closeModal();
    btn.onclick=async()=>{
      const entered=normalizeMnemonic(input.value),enteredPass=String(passEl.value||'').normalize('NFKD');
      if(!entered){status.className='alert danger mt';status.textContent='Enter your recovery phrase.';return;}
      btn.disabled=true;btn.textContent='Verifying…';
      try{
        const valid=await window._hdwallet.validateMnemonic(entered,window._bip39.wordlist);
        if(!valid)throw Error('Invalid BIP39 recovery phrase');
        if(env){
          const {env:matchedEnv,payload}=await decryptVaultWithSeed(entered);
          const configured=String(payload?.bip39Passphrase||'').normalize('NFKD');
          if(configured!==enteredPass)throw Error(configured?'Incorrect BIP39 passphrase':'A passphrase was not configured for this wallet');
          await completeRecoveryFromPayload(matchedEnv,payload,entered);
          return;
        }
        if(reason!=='initial')throw Error('The current wallet vault is unavailable. Start Local setup to recover a wallet from its seed phrase.');
        let importedState=null;
        if(importedBundle) importedState=await verifySignedWalletState(importedBundle,entered,enteredPass);
        await completeSeedOnlyRecovery(entered,enteredPass,importedState);
      }catch(e){status.className='alert danger mt';status.textContent=e?.message==='Invalid BIP39 recovery phrase'?'Recovery verification failed. Check the recovery phrase.':(e?.message||'Recovery verification failed.');}
      finally{if(document.contains(btn)){btn.disabled=false;btn.textContent='Verify';}}
    };
  }

        if(a!==b){status.className='alert danger mt';status.textContent='PINs do not match.';return;}
        if(a===S.pin){status.className='alert danger mt';status.textContent='Choose a different PIN.';return;}
        const verifiedSeed=normalizeMnemonic(factors?.seed||runtimeSeed||'');
        if(!verifiedSeed){status.className='alert danger mt';status.textContent='Verified recovery phrase is unavailable.';return;}

          S.pin=a;S.pinLength=a.length;S.pinHintDemo=a===DEMO_PIN;

          if(walletPersisted){storageSet(SAVED_STORAGE,JSON.stringify(env));storageRemove(LEGACY_STORAGE);}
          S.failedPinAttempts=0;S.securityBlocked=false;S.locked=true;
          closeModal();wipeRuntimeSecrets();
          toast('PIN changed securely. Wallet locked. Enter the new PIN to continue.','ok');render();

  function openCustomSeedPhrase(){
    if(S.securityBlocked)return toast('Wallet access is blocked. Recover the wallet first.','err');
    if(S.seedCustomizationUsed)return toast('Customise Seed Phrase has already been used for this wallet and cannot be used again.','err');
    openSecurityFactorGate('Customise Seed Phrase','Verify the current PIN, recovery phrase, and configured BIP39 passphrase before replacing the wallet seed. This operation is allowed only once for this wallet.',async(factors)=>{
      const host=$('#modalHost');host.classList.add('show');
      const currentLength=Number(S.seedLength||12);
      const allowed=VALID_WORD_COUNTS.map(n=>`${n} words`).join(', ');
      host.innerHTML=`<div class="sheet"><div class="handle"></div><div class="confirm-icon">🧩</div><h2 class="center">Customise Seed Phrase</h2><p class="center muted">Enter a new valid BIP39 recovery phrase. The phrase will replace the current wallet seed and therefore change every derived address and private key.</p><div class="alert warn"><b>One-time operation.</b> This can only be completed once. Existing accounts, balances, assets, settings and demo transaction history are preserved by account index, but all newly derived wallet addresses and keys will correspond to the new phrase.</div><label>New recovery phrase</label><textarea id="customSeedInput" placeholder="Enter ${currentLength} BIP39 words separated by spaces" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea><label>Word count</label><select id="customSeedLength">${VALID_WORD_COUNTS.map(n=>`<option value="${n}" ${n===currentLength?'selected':''}>${n} words</option>`).join('')}</select><div id="customSeedStatus" class="alert info mt">Allowed lengths: ${esc(allowed)}. The BIP39 checksum and entropy will be verified locally.</div><div class="confirm-actions"><button id="cancelCustomSeed" class="btn cancel">Cancel</button><button id="applyCustomSeed" class="btn accept">Replace seed</button></div></div>`;
      const input=$('#customSeedInput'),lenEl=$('#customSeedLength'),status=$('#customSeedStatus'),btn=$('#applyCustomSeed');
      lenEl.onchange=()=>{const n=Number(lenEl.value);const words=normalizeMnemonic(input.value).split(' ').filter(Boolean);status.className='alert info mt';status.textContent=`Selected ${n} words. Enter exactly ${n} valid BIP39 words; the checksum will be verified automatically.`;};
      $('#cancelCustomSeed').onclick=()=>closeModal();
      btn.onclick=async()=>{
        const chosenLen=Number(lenEl.value),nextSeed=normalizeMnemonic(input.value),wordCount=nextSeed?nextSeed.split(' ').filter(Boolean).length:0;
        if(!VALID_WORD_COUNTS.includes(chosenLen)){status.className='alert danger mt';status.textContent='Unsupported BIP39 word count.';return;}
        if(wordCount!==chosenLen){status.className='alert danger mt';status.textContent=`Enter exactly ${chosenLen} words separated by spaces.`;return;}
        if(normalizeMnemonic(nextSeed)===normalizeMnemonic(factors?.seed||runtimeSeed||S.seedPhrase||'')){status.className='alert danger mt';status.textContent='The new phrase must be different from the current recovery phrase.';return;}
        btn.disabled=true;btn.textContent='Validating…';

          const pass=String(S.bip39Passphrase||'').normalize('NFKD');
          // Preflight every existing HD account on every configured network with the new seed.

          for(const a of S.accounts){

            }

          host.innerHTML=`<div class="sheet"><div class="handle"></div><div class="confirm-icon">✓</div><h2 class="center">Updating wallet identity</h2><p class="center muted">Replacing the seed and rebuilding the wallet address/key derivation. Your accounts and demo balances remain unchanged.</p><div class="loader-container"><svg class="spinner" width="65" height="65" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg" role="status" aria-label="Loading"><circle class="path" cx="33" cy="33" r="30"></circle></svg></div></div>`;
          await new Promise(resolve=>setTimeout(resolve,5000));
          S.seedPhrase=nextSeed;S.seedLength=chosenLen;S.seedCustomizationUsed=true;hdCache={};S.rootFingerprint=await window._hdwallet.bip32RootFingerprint(nextSeed,pass);updateWalletIdentityBadge();
          runtimeSeed=nextSeed;
          normalizeAccountState();
          assertAccountStateIntegrity('after seed customization');
          const env=await buildVaultEnvelope(nextSeed,S.pin||'');
          vaultEnvelope=env;
          if(walletPersisted){storageSet(SAVED_STORAGE,JSON.stringify(env));storageRemove(LEGACY_STORAGE);} 
          closeModal();wipeRuntimeSecrets();
          toast('Custom recovery phrase applied. Wallet addresses and keys now derive from the new phrase. The one-time seed customization is permanently used.','ok');
          render();
        }catch(e){
          btn.disabled=false;btn.textContent='Replace seed';
          status.className='alert danger mt';status.textContent='Could not replace the recovery phrase: '+(e?.message||'unknown error');
        }
      };
    },{actionLabel:'Verify security factors',requirePassphrase:true});
  }

  function tabFaq(root){
    root.innerHTML=`
      <div class="card accent support-faq">
        <h2>Frequently asked questions</h2>
        <p class="muted support-faq-intro">Answers adapted to the current DibaVault wallet simulator and its bundled network, token, account and security model.</p>
        <details open><summary>Which networks and cryptocurrencies are supported?</summary><p>DibaVault includes principal native support for BTC, ETH, TRX, SOL, BNB, ZEC, XRP, DOGE, DASH, EGLD, AVAX, BCH, XTZ, LTC, XLM, POL and NEAR. Additional EVM-compatible networks are also represented in the local registry and are listed separately in Support.</p></details>
        <details><summary>What token standards are supported?</summary><p>The current simulator models EVM token entries such as ERC-20-style assets and MultiversX ESDT-style assets. A token must be present in the local registry before it can be selected or displayed.</p></details>
        <details><summary>Does DibaVault support NFTs?</summary><p>NFTs are not modeled as a dedicated first-class wallet asset type in the current build. The support page therefore does not claim generalized NFT custody or management.</p></details>
        <details><summary>What does native support mean in DibaVault?</summary><p>Native support means the network is represented by the wallet's local registry and its corresponding HD account/address derivation family is implemented in the project. It does not mean that the browser simulator is connected to that network's mainnet.</p></details>
        <details><summary>How are addresses derived for Solana, Tezos and MultiversX?</summary><p>These networks use network-specific derivation families in the DibaVault HD layer rather than the generic EVM family. The address view therefore derives them according to their registered network family.</p></details>
        <details><summary>Are all EVM networks shown in Native Support?</summary><p>No. The Native Support list intentionally shows only the principal networks. Additional EVM-compatible networks, such as Arbitrum, Base, OP Mainnet, Linea, zkSync Era, Morph and Plasma Mainnet, are listed separately so the main support list remains easy to understand.</p></details>
        <details><summary>Can I add more networks or tokens?</summary><p>Yes. The Networks and Tokens sections contain local registry forms. Newly added network and token entries become part of the simulator registry, subject to the wallet's local validation and state model.</p></details>
        <details><summary>Can I transfer funds between my own accounts?</summary><p>Yes. The Accounts section provides an internal transfer flow between accounts belonging to the same wallet. The operation is reviewed before confirmation and applies only to the simulator's modeled balances.</p></details>
        <details><summary>Can I swap assets between my own accounts?</summary><p>Yes. DibaVault includes an internal swap simulation between supported wallet assets/accounts. It uses the simulator's configured rate and operation fee; it is not connected to an external exchange or live liquidity source.</p></details>
        <details><summary>Does Send broadcast transactions to a live blockchain?</summary><p>No. The current project builds and signs simulator payloads locally. It does not claim live mainnet broadcasting from the browser wallet.</p></details>
        <details><summary>How are the recovery phrase and optional BIP39 passphrase protected?</summary><p>The project keeps these secrets in runtime memory when the wallet is unlocked and stores them only inside the encrypted wallet vault for persistence. They are excluded from the plain wallet-state export.</p></details>
        <details><summary>Is there a practical limit to accounts or assets?</summary><p>The simulator supports multiple HD accounts and a growing local asset registry. Practical limits are determined by browser memory and interface performance rather than a physical hardware-memory specification.</p></details>
        <details><summary>Why can a token appear in the registry but not in an account's visible portfolio?</summary><p>Account asset visibility is controlled separately under Accounts → Assets display. A registered asset can therefore exist in the wallet registry while remaining hidden from a particular account's portfolio until it is enabled for display.</p></details>
        <details><summary>Why might the displayed icon or name differ from another wallet?</summary><p>DibaVault uses the project's bundled icon mapping and registry metadata. The support section describes exactly what this build represents; another wallet may maintain a different or broader asset catalog.</p></details>
      </div>`;
  }
  function tabSettings(root){const currentLen=S.seedLength||12;root.innerHTML=`<div class="card"><h2>Settings</h2><div class="kv"><span class="k">Mode</span><span class="v">LOCAL HD WALLET SIMULATOR (BIP39/BIP32)</span></div><div class="kv"><span class="k">Firmware</span><span class="v mono">local-sim 1.0</span></div><div class="kv"><span class="k">Hardware confirmation</span><span class="v">Web panel</span></div><div class="kv"><span class="k">PIN</span><span class="v">${S.pin===DEMO_PIN?'Default':'Custom PIN'}</span></div><div class="kv"><span class="k">BIP39 passphrase</span><span class="v">${S.bip39Passphrase?'Configured':'None'}</span></div><div class="kv"><span class="k">BIP32 Root Fingerprint</span><span class="v mono">${esc(rootFingerprintDisplay(S.rootFingerprint))}</span></div><div class="kv"><span class="k">Security</span><span class="v">${S.securityBlocked?'Access blocked':`${S.failedPinAttempts||0}/5 failed attempts`}</span></div><div class="kv"><span class="k">Storage</span><span class="v">Encrypted local wallet vault; recovery phrase and PIN are never stored in plaintext</span></div><hr><div class="card" style="margin:0;background:#0b1315"><h3>Change PIN</h3><p class="muted">Changing the access PIN immediately locks the wallet. The next step is the new PIN at the lock screen.</p><button id="changePinBtn" class="btn btn-primary btn-block">Change access PIN</button></div><div class="card" style="margin:12px 0 0;background:#0b1315"><h3>Shuffle PIN Pad</h3><p class="muted">Randomize the positions of numeric PIN keys after the first successful wallet unlock. Enter/Backspace remain fixed.</p><div class="switchrow"><label class="switch"><input id="shufflePadToggle" type="checkbox" ${S.shufflePadEnabled?'checked':''}><span class="slider"></span></label><div class="grow"><b>${S.shufflePadEnabled?'Enabled':'Disabled'}</b><div class="small">First unlock always uses the original ordered pad.</div></div></div></div><div class="card" style="margin:12px 0 0;background:#0b1315"><h3>Adjust Demo Funds</h3><p class="muted">Adjust the native and supported stablecoin demo balances of the currently selected account. You can change one or several assets in one operation, once per unlock session.</p><div class="fund-note">Active account: <b>${esc(activeAccount()?.name||'Main')}</b></div><div class="fund-note">Session status: <b>${fundsAdjustedThisSession?'adjustment already used':'available'}</b></div><div class="fund-note">Last adjustment: ${timeAgo(S.lastFundsAdjustmentAt)}</div><button id="fundAdjustBtn" class="btn btn-primary btn-block mt" ${fundsAdjustedThisSession?'disabled':''}>Adjust Demo Funds</button></div><div class="card" style="margin:12px 0 0;background:#0b1315"><h3>Customise Seed Phrase</h3><p class="muted">Replace the current BIP39 recovery phrase once. The new phrase must use one of the supported word counts and pass the BIP39 checksum. Replacing it changes all derived addresses and keys while preserving the wallet's account/balance state.</p><div class="fund-note">Status: <b>${S.seedCustomizationUsed?'Already used — permanently locked':'Available — one-time operation'}</b></div><button id="customSeedBtn" class="btn btn-primary btn-block mt" ${S.seedCustomizationUsed?'disabled':''}>Customise Seed Phrase</button></div><div class="card" style="margin:12px 0 0;background:#0b1315"><h3>Wallet State Backup</h3><p class="muted">Export accounts, demo balances, configured assets and wallet settings as a signed state file. The export contains no recovery phrase, PIN, BIP39 passphrase or private keys.</p><button id="exportWalletStateBtn" class="btn btn-primary btn-block mt">Export signed wallet state</button><div id="exportWalletStateStatus" class="small mt"></div></div><hr><div class="alert warn"><b>HD cryptography enabled.</b> BIP39 mnemonic→512-bit seed, BIP32 child derivation, BIP86 Taproot for Bitcoin, BIP44 for EVM/Tron, and SLIP-0010/Ed25519 for Solana are derived locally. Private keys are held only in runtime memory. This remains a simulator: transactions are not serialized or broadcast on real networks.</div><button id="resetBtn" class="btn btn-danger btn-block mt">Reset local Wallet</button></div>`;$('#changePinBtn').onclick=openPinChange;$('#fundAdjustBtn').onclick=openFundsAdjust;$('#customSeedBtn').onclick=openCustomSeedPhrase;$('#resetBtn').onclick=openResetWallet;$('#exportWalletStateBtn').onclick=()=>{const btn=$('#exportWalletStateBtn');if(btn.disabled)return;openPinGate('Authorize wallet-state export','Enter your access PIN to validate and export the current signed wallet state.',async()=>{const status=$('#exportWalletStateStatus');btn.disabled=true;btn.textContent='Preparing…';try{const bundle=await createSignedWalletState();const stamp=new Date().toISOString().replace(/[:.]/g,'-');downloadJsonFile(`DibaVault-wallet-state-${stamp}.json`,bundle);status.textContent='Signed wallet state exported successfully. Keep this file private as it contains your demo wallet state, but never your seed or private keys.';toast('Signed wallet state exported','ok')}catch(err){status.textContent='Export failed: '+(err?.message||'unknown error');toast('Unable to export wallet state','err')}finally{btn.disabled=false;btn.textContent='Export signed wallet state';}} ,{actionLabel:'Verify PIN & export'});};$('#shufflePadToggle').onchange=async e=>{const previous=!!S.shufflePadEnabled;const next=!!e.target.checked;S.shufflePadEnabled=next;const toggleEl=e.target;toggleEl.disabled=true;try{if(runtimeSeed){await saveSecureVault();}renderTab();toast(`Shuffle PIN pad ${next?'enabled':'disabled'}`,'ok')}catch(err){S.shufflePadEnabled=previous;toggleEl.checked=previous;toggleEl.disabled=false;toast('Could not securely save Shuffle PIN setting: '+(err?.message||'unknown error'),'err');return;}toggleEl.disabled=false;};}

  // ---------- Inicio de la aplicación ----------
  $('#lockBtn').onclick=async()=>{
    try {
      if(runtimeSeed) await saveSecureVault();
      wipeRuntimeSecrets();
      S.locked=true;
      render();
    } catch(e) {
      toast('Could not lock securely: '+(e.message||'unknown error'),'err');
    }
  };
  window._bip39.ready.then(()=>window._hdwallet.selfTest()).then(async()=>{await migrateLegacyWalletIfNeeded();walletPersisted=savedVaultExists();if(walletPersisted){S=freshWallet();S.provisioned=true;S.locked=true;try{S.rootFingerprint=String(vaultEnvelope?.rootFingerprint||'').toUpperCase().replace(/^0X/,'')}catch{};updateWalletIdentityBadge();updateLockButtonVisibility();}cryptoReady=true;if(startupDismissed)render()}).catch(e=>{console.error('Cryptographic initialization failed:',e);app.innerHTML=`<div class="card"><div class="alert danger"><h2>Cryptographic initialization failed</h2><p>${esc(e.message||'Unable to initialize BIP39/BIP32')}</p><p class="small">The wallet UI remains disabled until the BIP39 wordlist and cryptographic self-tests pass.</p></div></div>`});

} catch(e) {
  console.error('Error crítico:', e);
  alert('Error en la aplicación: ' + e.message);
}
})();
</script>
</body>
